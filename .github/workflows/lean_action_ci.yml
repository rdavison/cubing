name: Lean Action CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
      - name: Forbid constructs the axiom audit cannot see in executable code
        run: |
          if grep -rnE 'implemented_by|@\[extern|unsafe|partial def|native_decide|bv_decide' CubingImpl; then
            echo "Executable code must not use implemented_by, extern, unsafe, partial, native_decide or bv_decide."
            exit 1
          fi
      # One cache for both workspaces: book/ shares the root's packages, so this holds the
      # compiled Verso and the library. Mathlib's build comes from its own cache instead.
      - name: Restore the Lake cache
        id: lake-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            .lake
            book/.lake
            !.lake/packages/mathlib/.lake/build
          key: lake-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'book/lake-manifest.json') }}-${{ github.sha }}
          restore-keys: lake-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'book/lake-manifest.json') }}-
      # Missing docstrings and prose that Verso cannot check are warnings; --wfail makes them errors.
      - uses: leanprover/lean-action@v1
        with:
          build-args: "--wfail"
          use-github-cache: false
      # The site build elaborates every chapter's prose against the library and computes every
      # cube picture from the model, so a stale chapter or a missing one fails here.
      - name: Build the site
        working-directory: book
        run: |
          lake build
          lake exe cubing-site
      - name: Save the Lake cache
        if: steps.lake-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            .lake
            book/.lake
            !.lake/packages/mathlib/.lake/build
          key: ${{ steps.lake-cache.outputs.cache-primary-key }}
      - name: Upload the site for Pages
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/upload-pages-artifact@v3
        with:
          path: book/_out/html-multi

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
