name = "cubing-site"
version = "0.1.0"
defaultTargets = ["cubing-site"]
# Share the root project's dependencies: one Mathlib and one Verso for both workspaces.
packagesDir = "../.lake/packages"

[[require]]
name = "verso"
git = "https://github.com/leanprover/verso"
rev = "v4.29.0-rc4"

[[require]]
name = "cubing"
path = ".."

[[lean_lib]]
name = "CubingSite"

[[lean_exe]]
name = "cubing-site"
root = "Main"
supportInterpreter = true
