name = "cubing"
version = "0.1.0"
defaultTargets = ["Cubing", "CubingAudit"]

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4"
rev = "master"

[[lean_lib]]
name = "Cubing"
weakLeanOptions = {experimental.module = true}
leanOptions = {doc.verso = true, linter.missingDocs = true}

[[lean_exe]]
name = "cubing-exe"
root = "Main"

[[lean_lib]]
name = "CubingImpl"
precompileModules = true
weakLeanOptions = {"experimental.module" = true}

[[lean_lib]]
name = "CubingAudit"

[[lean_lib]]
name = "CubingResults"

[[require]]
name = "verso"
git = "https://github.com/leanprover/verso"
rev = "v4.29.0-rc4"
